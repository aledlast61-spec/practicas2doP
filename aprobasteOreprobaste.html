<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aprobado o reprobado?</title>
</head>
<body>
    <script>
        let calificacion = Number(prompt(`calificacion :`));
        if (calificacion >= 6){
            document.write("aprobaste");
        }else{
            document.write("reprobaste");
        }
    </script>
</body>
</html>
