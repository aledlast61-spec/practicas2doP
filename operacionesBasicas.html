<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operacionesBasicas</title>
</head>
<body>
    <h1>operaciones basicas</h1>
    <script>
        let N1=Number(prompt(`introduce el primer numero: `))
        let N2=Number(prompt(`introduce el segundo numero: `))

        suma=N1+N2;
        resta=N1-N2;
        multiplicacion=N1*N2;
        division=N1/N2;

        document.write("suma" + "<br>" + N1 + "+" + N2 + "=" + suma + "<br>");
        document.write("resta" + "<br>" + N1 + "-" + N2 + "=" + resta + "<br>");
        document.write("multiplicación" + "<br>" + N1 + "*" + N2 + "=" + multiplicacion + "<br>");
        document.write("división" + "<br>" + N1 + "/" + N2 + "=" + division );

    </script>
</body>
</html>
