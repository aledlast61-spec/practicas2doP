<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>promedio tttres parciales</title>
</head>
<body>
    <script>
        alert ("ingresa tus promedios");
        let c = 0;
        let promedio = 0;
        let i = 1;
        for (i = 1;i <= 3; i++){
            switch (i){
                case 1 : c = Number(prompt(`1er parcial: `)); break;
                case 2 : c = Number(prompt(`2do parcial: `)); break;
                case 3 : c = Number(prompt(`3er parcial: `)); break;
            }
            promedio = promedio + c;
        }
        promedio = parseInt(promedio/(i-1));
        if (promedio >= 6){
            document.write("felicidades, tu promedio es de: " + promedio + "<br>" + "aprobaste");
        }else{
            document.write("ups, tu promedio es de: " + promedio + "<br>" + "reprobaste");
        }
    </script>

</body>
</html>
