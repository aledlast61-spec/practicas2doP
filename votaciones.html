<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puedo votar?</title>
</head>
<body>
    <label>ciudadano o alien? </label>
    <script>
        let edad = Number(prompt(`edad: `));
        if (edad >= 18){
            document.write("eres un ciudadano" + "<br>" + "puedes votar");
        }else{
            document.write("eres un alien" + "<br>" + "no puedes votar");
        }
    </script>
    
</body>
</html>
